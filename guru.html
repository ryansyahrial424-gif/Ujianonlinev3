<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Guru - Portal Ujian Online</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #a8edd9 0%, #fed6e3 100%);
      --primary: #ff6b6b; --secondary: #4ecdc4; --purple: #6c5ce7;
      --danger: #ff7675; --dark: #2d3436; --card-bg: rgba(255, 255, 255, 0.95);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg-gradient); min-height: 100vh; color: var(--dark); padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    .card { background: var(--card-bg); border-radius: 24px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border: 3px solid #fff; margin-bottom: 20px; }
    h2 { font-family: 'Fredoka', sans-serif; color: var(--purple); margin-bottom: 15px; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { font-weight: 600; display: block; margin-bottom: 5px; }
    .form-control { width: 100%; padding: 12px 16px; border-radius: 12px; border: 2px solid #dfe6e9; font-size: 1rem; outline: none; }
    .form-control:focus { border-color: var(--purple); }
    .btn { font-family: 'Fredoka', sans-serif; font-size: 1rem; padding: 10px 18px; border: none; border-radius: 50px; cursor: pointer; transition: all 0.3s; }
    .btn-primary { background: var(--purple); color: #fff; box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-success { background: #00b894; color: #fff; }
    .btn-info { background: #0984e3; color: #fff; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; border-radius: 12px; overflow: hidden; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #f1f2f6; font-size: 0.9rem; }
    th { background: var(--purple); color: white; font-family: 'Fredoka', sans-serif; }
    tr:hover { background: #f8f9fa; }
    .flex-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .status-text { font-size: 0.85rem; color: #636e72; margin-top: 5px; }
  </style>

<style id="index4-visual-theme">
/* ============================================================
   TEMA VISUAL SAMA DENGAN index(4).html
   HANYA CSS/TAMPILAN — LOGIKA JAVASCRIPT TIDAK DIUBAH.
   ============================================================ */

:root {
  --bg-body: #f0f7ff;
  --primary: #0284c7;
  --primary-cyan: #06b6d4;
  --primary-light: #38bdf8;
  --accent-yellow: #f59e0b;
  --yellow-bright: #facc15;
  --success: #10b981;
  --danger: #ef4444;
  --dark: #0f172a;
  --card-bg: rgba(255,255,255,.94);
  --border-color: #e2e8f0;
  --shadow-blue: rgba(2,132,199,.20);
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg-body);
}

body {
  background:
    radial-gradient(circle at 10% 10%, rgba(56,189,248,.10) 0%, transparent 38%),
    radial-gradient(circle at 90% 90%, rgba(250,204,21,.09) 0%, transparent 38%),
    linear-gradient(135deg, #f0f7ff 0%, #f8fbff 55%, #eef8ff 100%);
  min-height: 100vh;
  color: var(--dark);
  padding: 24px 16px;
}

.container {
  max-width: 1000px;
}

/* Semua kartu mengikuti gaya kartu index(4) */
.card {
  background: rgba(255,255,255,.94);
  border: 1px solid rgba(226,232,240,.95);
  border-radius: 24px;
  box-shadow:
    0 12px 30px rgba(15,23,42,.07),
    0 3px 10px rgba(2,132,199,.04);
  backdrop-filter: blur(8px);
  margin-bottom: 20px;
}

h2 {
  font-family: 'Plus Jakarta Sans', sans-serif;
  color: var(--primary);
  font-weight: 800;
  letter-spacing: -.3px;
}

/* Form */
.form-group label {
  color: #334155;
  font-weight: 700;
}

.form-control {
  background: #fff;
  border: 1.5px solid #dbe5ee;
  color: var(--dark);
  border-radius: 12px;
  transition: .2s ease;
}

.form-control:focus {
  border-color: var(--primary-light);
  box-shadow: 0 0 0 4px rgba(56,189,248,.12);
}

/* Tombol mengikuti bentuk dan warna index(4) */
.btn {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  border-radius: 12px;
  transition: all .25s ease;
}

.btn-primary {
  background: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
  color: #fff;
  box-shadow: 0 5px 14px rgba(2,132,199,.22);
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 18px rgba(2,132,199,.30);
}

.btn-danger {
  background: linear-gradient(135deg, #ef4444, #f87171);
  color: #fff;
}

.btn-success {
  background: linear-gradient(135deg, #10b981, #34d399);
  color: #fff;
}

.btn-info {
  background: linear-gradient(135deg, #0284c7, #38bdf8);
  color: #fff;
}

/* Tabel */
table {
  background: #fff;
  border-radius: 14px;
  border: 1px solid #e2e8f0;
  box-shadow: 0 5px 16px rgba(15,23,42,.04);
  overflow: hidden;
}

th, td {
  border-bottom: 1px solid #edf2f7;
}

th {
  background: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
  color: #fff;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 800;
}

tr:hover {
  background: #f0f9ff;
}

/* Elemen statistik/label */
.badge,
.tag,
.stat,
.status {
  border-radius: 999px;
}

/* Link dan aksen */
a {
  color: var(--primary);
}

a:hover {
  color: #0369a1;
}

/* Modal / panel jika ada */
.modal,
.modal-content,
.panel,
.dropdown-menu {
  border-radius: 20px;
}

.modal-content,
.panel {
  background: rgba(255,255,255,.97);
  box-shadow: 0 20px 45px rgba(15,23,42,.14);
  border: 1px solid #e2e8f0;
}

/* Scrollbar agar senada */
::-webkit-scrollbar {
  width: 9px;
  height: 9px;
}

::-webkit-scrollbar-track {
  background: #eaf3f9;
}

::-webkit-scrollbar-thumb {
  background: linear-gradient(#38bdf8, #0284c7);
  border-radius: 20px;
}

::-webkit-scrollbar-thumb:hover {
  background: #0284c7;
}

/* Responsif mengikuti nuansa index(4) */
@media (max-width: 700px) {
  body {
    padding: 14px 10px;
  }

  .container {
    width: 100%;
  }

  .card {
    border-radius: 18px;
    padding: 20px;
  }

  table {
    font-size: .85rem;
  }

  th, td {
    padding: 10px 9px;
  }
}
</style>

</head>
<body>
  <div class="container">
    <!-- PANEL KONTROL GURU -->
    <div class="card">
      <h2><i class="fa-solid fa-chalkboard-user"></i> Panel Kontrol Guru Ujian Online</h2>
      <div class="flex-row" style="margin-bottom: 20px;">
        <div class="form-group" style="flex: 1; margin-bottom:0;">
          <label>Atur Token Ujian Aktif</label>
          <input type="text" id="tokenInput" class="form-control" placeholder="Contoh: SMP99">
        </div>
        <button class="btn btn-primary" style="margin-top: 24px;" onclick="saveToken()">Simpan Token</button>
      </div>
      <div class="flex-row" style="gap: 10px;">
        <button class="btn btn-info" onclick="fetchLiveResults()"><i class="fa-solid fa-rotate"></i> Muat Ulang Data (Sync Cloud)</button>
        <button class="btn btn-success" onclick="exportToExcel()"><i class="fa-solid fa-file-excel"></i> Unduh Rekap (.xls / Excel)</button>
      </div>
      <div id="statusText" class="status-text">Status: Siap memuat data...</div>
    </div>

    <!-- TABEL HASIL UJIAN SISWA -->
    <div class="card">
      <h2><i class="fa-solid fa-clipboard-list"></i> Daftar Nilai & Hasil Ujian Siswa</h2>
      <div class="flex-row" style="margin-bottom: 15px;">
        <div style="flex:1;">
          <label style="font-size:0.85rem; font-weight:600;">Filter Kelas:</label>
          <select id="filterClass" class="form-control" onchange="renderTable()">
            <option value="ALL">Semua Kelas</option>
            <option value="7.1">Kelas 7.1</option>
            <option value="7.2">Kelas 7.2</option>
            <option value="7.3">Kelas 7.3</option>
            <option value="8.1">Kelas 8.1</option>
            <option value="8.2">Kelas 8.2</option>
            <option value="9.1">Kelas 9.1</option>
            <option value="9.2">Kelas 9.2</option>
          </select>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table id="exportTable">
          <thead>
            <tr>
              <th>Waktu Kirim</th>
              <th>Nama Siswa</th>
              <th>Kelas</th>
              <th>Mapel</th>
              <th>Nilai PG</th>
              <th>Pelanggaran Tab</th>
              <th>Jawaban Essay</th>
            </tr>
          </thead>
          <tbody id="resultTableBody">
            <tr><td colspan="7" style="text-align:center; color:#b2bec3;">Belum ada data ujian yang masuk.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
  // Masukkan URL Deploy Web App Google Apps Script Anda di sini:
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxIhRE-1Au2CaBQLZmG0U832RVB1XCAxKYl6hRknD2lH_cEvYkKBK_qObF5cvbbeNN6Sg/exec";

  let fetchedExamHistory = [];

  window.onload = function() {
    loadLiveToken();
    fetchLiveResults();
  };

  // Mengambil token aktif dari Cloud saat dashboard dibuka
  function loadLiveToken() {
    fetch(`${SCRIPT_URL}?action=getToken`)
      .then(res => res.json())
      .then(data => {
        if (data && data.token) {
          document.getElementById('tokenInput').value = data.token;
        }
      })
      .catch(err => console.error("Gagal memuat token dari server:", err));
  }

  // Menyimpan token baru ke Cloud
  function saveToken() {
    const newToken = document.getElementById('tokenInput').value.trim();
    if (!newToken) return alert("Token tidak boleh kosong!");

    const statusEl = document.getElementById('statusText');
    statusEl.innerText = "Status: Menyimpan token ke cloud...";

    fetch(`${SCRIPT_URL}?action=setToken&token=${encodeURIComponent(newToken)}`)
      .then(res => res.json())
      .then(data => {
        alert(`Token ujian berhasil diperbarui di cloud secara real-time: ${data.token}`);
        statusEl.innerText = `Status: Token aktif di cloud saat ini adalah "${data.token}"`;
      })
      .catch(err => {
        console.error(err);
        alert("Gagal memperbarui token ke server cloud!");
        statusEl.innerText = "Status: Gagal menyimpan token.";
      });
  }

  // Mengambil data nilai siswa dari Cloud
  function fetchLiveResults() {
    const statusEl = document.getElementById('statusText');
    statusEl.innerText = "Status: Mengambil data terbaru dari Google Sheet...";

    fetch(SCRIPT_URL)
      .then(res => res.json())
      .then(data => {
        fetchedExamHistory = Array.isArray(data) ? data : [];
        renderTable();
        statusEl.innerText = `Status: Berhasil memperbarui data (${fetchedExamHistory.length} siswa ditemukan). Total diperbarui pada ${new Date().toLocaleTimeString('id-ID')}`;
      })
      .catch(err => {
        console.error(err);
        statusEl.innerText = "Status: Gagal mengambil data cloud.";
      });
  }

  function renderTable() {
    const tbody = document.getElementById('resultTableBody');
    const filterClass = document.getElementById('filterClass').value;
    let history = [...fetchedExamHistory];

    if (filterClass !== "ALL") {
      history = history.filter(item => item.class === filterClass);
    }

    if (history.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#94a3b8;">Belum ada data ujian yang masuk.</td></tr>`;
      return;
    }

    tbody.innerHTML = '';
    history.forEach((item) => {
      const row = document.createElement('tr');
      
      let essayText = "";
      if (Array.isArray(item.essayAnswers) && item.essayAnswers.length > 0) {
        essayText = item.essayAnswers.join("<br>");
      } else if (typeof item.essayAnswers === 'string') {
        essayText = item.essayAnswers.replace(/\n/g, "<br>");
      } else {
        essayText = "Tidak ada jawaban essay.";
      }

      const violText = `${item.violations || 0}x Pindah Tab`;

      row.innerHTML = `
        <td>${item.time || '-'}</td>
        <td>${item.name || '-'}</td>
        <td>${item.class || '-'}</td>
        <td>${item.subject || '-'}</td>
        <td><b>${item.score !== undefined ? item.score : 0}</b></td>
        <td>${violText}</td>
        <td>${essayText}</td>
      `;
      tbody.appendChild(row);
    });
  }

  function exportToExcel() {
    const tableHTML = document.getElementById('exportTable').outerHTML.replace(/ /g, '%20');
    const filename = `Rekap_Nilai_Ujian_${new Date().toISOString().slice(0,10)}.xls`;
    
    const downloadLink = document.createElement('a');
    downloadLink.href = 'data:application/vnd.ms-excel,' + tableHTML;
    downloadLink.download = filename;
    
    document.body.appendChild(downloadLink);
    downloadLink.click();
    document.body.removeChild(downloadLink);
  }
</script>
</body>
</html>
